[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-visualizer"
version = "4.1.0"
description = "Dota 2 History Visualizer - Desktop Application & Decoupled Web Architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter",
    "pandas",
    "requests",
    "matplotlib",
    "pillow",
    "opencv-python",
    "moviepy<2.0",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "slowapi",
    "pyjwt",
    "celery",
    "redis"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
